name: Testes Automatizados

on:
  push:
    branches: [ "S3/3.1" ]
  pull_request:
    branches: [ "S3/3.1" ]

jobs:
  test:
    runs-on: ubuntu-latest

    # 1. O GitHub sobe um banco PostGIS zerado na mesma máquina
    services:
      postgis:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Executar Pytest
        env:
          # 2. Injeta a URL do container ultra-rápido local
          TEST_DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
          
          # Variáveis obrigatórias do seu Pydantic Settings
          GOOGLE_MAPS_API_KEY: mock_key_actions
          SECRET_KEY: chave_secreta_para_testes
          MAIL_USERNAME: teste@teste.com
          MAIL_PASSWORD: senha_falsa
          MAIL_FROM: teste@teste.com
          MAIL_SERVER: smtp.test.com
          MAIL_PORT: 587
          MAIL_STARTTLS: True
          MAIL_SSL_TLS: False
        run: |
          pytest